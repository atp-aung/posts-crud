<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, max-age=0"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Sign Up | Posts CRUD</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <style>
      body {
        min-height: 100vh;
        background: #f1f5f9;
      }

      .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }

      .auth-card {
        width: 100%;
        max-width: 460px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(15, 23, 42, 0.07);
      }

      .brand-icon {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        border-radius: 14px;
        background: #4f46e5;
        color: white;
        font-size: 23px;
        font-weight: bold;
      }

      .form-control {
        padding: 11px 13px;
        font-size: 14px;
      }

      .form-control:focus {
        border-color: #818cf8;
        box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.12);
      }

      .btn-primary {
        background: #4f46e5;
        border-color: #4f46e5;
      }

      .btn-primary:hover {
        background: #4338ca;
        border-color: #4338ca;
      }
    </style>

    <script type="module" src="./js/auth.js"></script>
  </head>

  <body>
    <main class="auth-wrapper">
      <div class="card auth-card bg-white">
        <div class="card-body p-4 p-md-5">
          <!-- Brand -->
          <div class="text-center mb-4">
            <div class="brand-icon mb-3">P</div>

            <h3 class="fw-bold text-dark mb-2">Create Account</h3>

            <p class="text-secondary small mb-0">
              Sign up to get started with Posts CRUD
            </p>
          </div>

          <!-- Signup Form -->
          <form id="signup-form" autocomplete="on">
            <div class="mb-3">
              <label for="signup-username" class="form-label fw-semibold small">
                Username
              </label>

              <div class="input-group">
                <span class="input-group-text bg-light">
                  <i class="fa-solid fa-user text-secondary"></i>
                </span>

                <input
                  type="text"
                  id="signup-username"
                  name="username"
                  class="form-control"
                  placeholder="Choose a username"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="signup-email" class="form-label fw-semibold small">
                Email Address
              </label>

              <div class="input-group">
                <span class="input-group-text bg-light">
                  <i class="fa-solid fa-envelope text-secondary"></i>
                </span>

                <input
                  type="email"
                  id="signup-email"
                  name="email"
                  class="form-control"
                  placeholder="Enter your email"
                  autocomplete="email"
                  required
                />
              </div>
            </div>

            <div class="mb-4">
              <label for="signup-password" class="form-label fw-semibold small">
                Password
              </label>

              <div class="input-group">
                <span class="input-group-text bg-light">
                  <i class="fa-solid fa-lock text-secondary"></i>
                </span>

                <input
                  type="password"
                  id="signup-password"
                  name="password"
                  class="form-control"
                  placeholder="Create a password"
                  minlength="8"
                  autocomplete="new-password"
                  required
                />
              </div>

              <div class="form-text">
                Password must be at least 8 characters.
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2 fw-semibold"
            >
              <i class="fa-solid fa-user-plus me-2"></i>
              Create Account
            </button>
          </form>

          <!-- Message -->
          <div
            id="message"
            class="small text-center mt-3"
            role="status"
            aria-live="polite"
          ></div>

          <hr class="my-4" />

          <p class="text-center text-secondary small mb-0">
            Already have an account?
            <a
              href="login.html"
              class="fw-semibold text-primary text-decoration-none"
            >
              Login
            </a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
